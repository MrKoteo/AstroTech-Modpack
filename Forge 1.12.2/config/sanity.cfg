# Configuration file

general {

    ##########################################################################################################
    # mechanics
    #--------------------------------------------------------------------------------------------------------#
    # Mechanics Options
    ##########################################################################################################

    mechanics {
        # The sanity to decrease when players are around a player with sanity < 50. (per 0.5s, within 5 blocks)
        # Min: 0.0
        # Max: 0.5
        D:"Abnormal Player"=0.2

        # The sanity to increase when players gain an advancement.
        # Min: 0.0
        # Max: 100.0
        D:Advancement=15.0

        # The sanity to decrease when players attack an animal.
        # Min: 0.0
        # Max: 100.0
        D:"Attack Animal"=0.05

        # The sanity to decrease when players attack another player.
        # Min: 0.0
        # Max: 100.0
        D:"Attack Player"=0.4

        # The sanity to decrease when players attack a villager.
        # Min: 0.0
        # Max: 100.0
        D:"Attack Villager"=0.4

        # The list of baubles which will decrease or increase sanity when players wear it. ('bauble;value', per 0.5s)
        S:Baubles <
            sanity:garland;0.2
         >

        # Whether to make the list of dimensions blacklist or not.
        B:Blacklist=true

        # The sanity to increase when players bred animals.
        # Min: 0.0
        # Max: 100.0
        D:Bred=5.0

        # The sanity to decrease when player's air < 90. (per 0.5s)
        # Min: 0.0
        # Max: 0.5
        D:Choking=0.5

        # The sanity to increase by the composure effect at each interval.
        # Min: 0.0
        # Max: 100.0
        D:Composure=1.0

        # The sanity to decrease when players are in dark. (per 0.5s)
        # Min: 0.0
        # Max: 0.5
        D:Dark=0.01

        # The list of dimensions which will enable sanity.
        I:Dimensions <
         >

        # The list of entities which will decrease or increase sanity when players stay with it. ('entity;value', per 0.5s, within 5 blocks)
        S:Entities <
            minecraft:zombie_pigman;0.0
            minecraft:enderman;1.0
         >

        # The list of blocks or liquids which will decrease or increase sanity when players are in it. ('block;value', per 0.5s)
        S:Environment <
            minecraft:web;-0.1
            minecraft:lava;-0.1
            minecraft:carpet;0.1
         >

        # The list of equipments which will decrease or increase sanity when players wear it. ('equipment;value', per 0.5s)
        S:Equipments <
            sanity:garland;0.2
         >

        # The sanity to decrease when food spoiled in player's inventory. (per 1s)
        # Min: 0.0
        # Max: 1.0
        D:"Food Spoiling"=0.025

        # The sanity to decrease when player's foodLevel < 6. (per 0.5s)
        # Min: 0.0
        # Max: 0.5
        D:Hunger=0.1

        # The sanity to decrease based on the damage with the ratio of 1 to this number.
        # Min: 0.0
        # Max: 100.0
        D:Hurt=0.01

        # The list of items and the sanity to decrease or increase when eat it. ('item;value')
        S:Items <
            minecraft:rotten_flesh;-3.0
            minecraft:spider_eye;-3.0
            minecraft:chicken;-2.0
            minecraft:porkchop;-2.0
            minecraft:mutton;-2.0
            minecraft:beef;-2.0
            minecraft:rabbit;-2.0
            minecraft:poisonous_potato;-2.0
            minecraft:fish;-2.0
            minecraft:fish:1;-2.0
            minecraft:fish:2;-2.0
            minecraft:fish:3;-2.0
         >

        # The sanity to increase when players kill a mob.
        # Min: 0.0
        # Max: 100.0
        D:"Kill Mob"=1.0

        # The sanity to decrease when players are struck by lightning.
        # Min: 0.0
        # Max: 100.0
        D:Lightning=20.0

        # The sanity to decrease when players lose pets.
        # Min: 0.0
        # Max: 100.0
        D:Lost=10.0

        # The sanity to decrease when mobs are around player. (per 0.5s, within 8 blocks)
        # Min: 0.0
        # Max: 0.5
        D:Mob=0.001

        # The sanity to increase when players are around a player with sanity ≥ 50. (per 0.5s, within 5 blocks)
        # Min: 0.0
        # Max: 0.5
        D:"Normal Player"=0.15

        # The sanity to increase when players stay with pets. (per 0.5s, within 5 blocks)
        # Min: 0.0
        # Max: 0.5
        D:Pet=0.25

        # The sanity to increase when players complete a quest. (only support FTB Quests)
        # Min: 0.0
        # Max: 100.0
        D:Quest=25.0

        # The sanity to decrease when players get wet by rain. (per 0.5s)
        # Min: 0.0
        # Max: 0.5
        D:Rain=0.001

        # Whether to reset sanity after respawning.
        B:"Reset Sanity"=true

        # The sanity to increase when players wake up.
        # Min: 0.0
        # Max: 100.0
        D:Sleep=50.0

        # The sanity to decrease when player's thirstLevel < 6. (per 0.5s, support ToughAsNails and SimpleDifficulty)
        # Min: 0.0
        # Max: 0.5
        D:Thirst=0.1

        # The sanity to decrease when players change dimension.
        # Min: 0.0
        # Max: 100.0
        D:Trip=5.0
    }

    ##########################################################################################################
    # overlay
    #--------------------------------------------------------------------------------------------------------#
    # Overlay Options
    ##########################################################################################################

    overlay {
        # Enable blood overlay when sanity is lower than the value. (set this to -1 to disable)
        I:"Blood Overlay"=-1

        # How many seconds the brain overlay should be visible when sanity changed. (set this to -1 to disable)
        # Min: -1
        # Max: 30
        I:"Brain Overlay Flash Time"=-1

        # Offset on x of the brain overlay. A positive number means a shift to the right.
        I:"Brain Overlay OffX"=0

        # Offset on y of the brain overlay. A positive number means a shift to the top.
        I:"Brain Overlay OffY"=0

        # Make brain overlay shake on screen when sanity is lower than the value. (set this to -1 to disable)
        # Min: -1
        # Max: 100
        I:"Brain Overlay Shake"=40

        # Whether to mirror the position of brain overlay to the other side automatically based on the status of the hands.
        B:"Hand Check"=true

        # Highlight the border of brain overlay when change in sanity is greater than or equal to this value.
        # Min: 0.0
        # Max: 100.0
        D:Highlight=1.0
    }

    ##########################################################################################################
    # effects
    #--------------------------------------------------------------------------------------------------------#
    # Effects Options
    ##########################################################################################################

    effects {
        # Spawn fake mobs around player when sanity is lower than the value. (set this to -1 to disable)
        I:"Ghost Effects"=30

        # Set level1 shader and enable when sanity is lower than the value. ('shader;value')
        S:Level1=notch.json;50

        # Set level2 shader and enable when sanity is lower than the value. ('shader;value')
        S:Level2=deconverge.json;30

        # Set level3 shader and enable when sanity is lower than the value. ('shader;value')
        S:Level3=bits.json;15

        # The list of ghosts which will randomly appear in the player's view, including their spawn radius and duration. ('ghost;min_radius;max_radius;min_ticks;max_ticks')
        S:"Random Ghosts" <
            minecraft:creeper;1;5;20;100
            minecraft:skeleton;1;5;20;100
            minecraft:creeper;1;5;20;100
            minecraft:zombie;1;5;20;100
            minecraft:enderman;1;5;20;100
         >

        # The list of sounds which will play randomly when sanity is low, including their volume and pitch values. ('sound;volume;pitch') | ('sound;min_volume;max_volume;min_pitch;max_pitch')
        S:"Random Sounds" <
            entity.creeper.primed;1.0;0.5
            entity.tnt.primed;1.0;0.5
            entity.skeleton.ambient;0.5;1.5;0.5;1.5
            entity.skeleton.step;1.0;0.5
            entity.zombie.ambient;0.5;1.5;0.5;1.5
            entity.zombie.step;1.0;0.5
            entity.enderman.ambient;0.5;1.5;0.5;1.5
            entity.hostile.big_fall;1.0;0.5
            block.chest.open;1.0;0.5
            block.chest.close;1.0;0.5
            block.wooden_door.open;1.0;0.5
            block.wooden_trapdoor.open;1.0;0.5
            entity.wolf.growl;0.5;1.5;0.5;1.5
         >

        # Whether to enable the shader effects.
        B:"Shader Effects"=true

        # Play random sounds when sanity is lower than the value. (set this to -1 to disable)
        I:"Sound Effects"=40

        # Play whispering when sanity is lower than the value. (set this to -1 to disable)
        I:"Whisper Effects"=10
    }

}


