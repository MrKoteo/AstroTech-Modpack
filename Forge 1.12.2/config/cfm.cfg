# Configuration file

integration-settings {
    # Whether furniture with support for SuiKeCherry should be enabled. Disabled automatically when Cosmetic Wood is detected. [default: true]
    B:integration-SuiKeCherry=false

    # Whether furniture with support for Thaumcraft should be enabled. Disabled automatically when Cosmetic Wood is detected. [default: true]
    B:integration-Thaumcraft=false

    # Whether furniture with support for Biomes O' Plenty should be enabled. Disabled automatically when Cosmetic Wood is detected. [default: true]
    B:integration-biomesoplenty=false

    # Whether furniture with support for Palebloom should be enabled. Disabled automatically when Cosmetic Wood is detected. [default: true]
    B:integration-palebloom=false

    # Whether furniture with support for Rustic should be enabled. Disabled automatically when Cosmetic Wood is detected. [default: true]
    B:integration-rustic=false
}


